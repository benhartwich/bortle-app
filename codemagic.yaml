# Codemagic builds of the Bortle app. The Flutter project lives at the repository root.
#
# The iOS release reads its keys from the secure variable group "bortle_store". The
# allskyhub hub fills it from its vault (admin → "bortle"): the App Store Connect API key
# of the shared team and the private key of the team's iOS distribution certificate
# (Apple limits distribution certificates per team, so both apps sign with the same one).
# No key is ever written into this repository or the Codemagic UI by hand. The hub
# starts "ios-release" on main through the Codemagic API.
#
# SECURITY: manual only. This repository is public and bortle_store holds team-wide
# keys, so never add a `triggering` section, above all no pull_request trigger: a
# build of a fork's pull request would expose them (docs/CONCEPT.md).
#
# Until the Flutter project exists (phase 1), both workflows fail at "Packages".
# Android store builds are still open: the app needs its own upload keystore and the
# first AAB uploaded by hand in the Play Console.

definitions:
  flutter: &flutter
    flutter: stable
  scripts:
    - &get
      name: Packages
      script: flutter pub get
    - &check
      name: Analyze and test
      script: |
        dart format --output=none --set-exit-if-changed lib test
        flutter analyze
        flutter test

workflows:
  # Manual: analyze, test, debug APK, unsigned iOS build.
  app-check:
    name: App check
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *flutter
      xcode: latest
    scripts:
      - *get
      - *check
      - name: Android debug APK
        script: flutter build apk --debug
      - name: iOS build without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  # Signed iOS build to TestFlight. The profile comes from Apple with the team key;
  # --create makes it on the first run, with the shared distribution certificate.
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter
      xcode: latest
      groups: [bortle_store]
    scripts:
      - *get
      - *check
      - name: Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files eu.bortle.app --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      # Push: the app's public Firebase identifiers, plain variables in bortle_store that
      # the hub writes from Ben's GoogleService-Info.plist. Empty ones build an app
      # without push (lib/push.dart).
      - name: IPA
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=BORTLE_FCM_PROJECT_ID="${BORTLE_FCM_PROJECT_ID:-}" \
            --dart-define=BORTLE_FCM_SENDER_ID="${BORTLE_FCM_SENDER_ID:-}" \
            --dart-define=BORTLE_FCM_IOS_APP_ID="${BORTLE_FCM_IOS_APP_ID:-}" \
            --dart-define=BORTLE_FCM_IOS_API_KEY="${BORTLE_FCM_IOS_API_KEY:-}"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # Manual: store screenshots of the real app against bortle.eu, signed in as the review
  # account, in an iPhone simulator (1290 × 2796, the App Store's 6.7"/6.9" set) and an
  # Android emulator, as artefacts <store>_<locale>_<NN-name>.png. The allskyhub hub starts
  # it ("Screenshots erzeugen") and takes the pictures over ("Screenshots übernehmen").
  # No signing. The review account's login comes from the secure group
  # "bortle_screenshots" (SHOT_LOGIN, SHOT_PASSWORD), which holds nothing else: no store
  # or signing key is in reach of this workflow.
  store-screenshots:
    name: Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter
      xcode: latest
      groups: [bortle_screenshots]
    scripts:
      - *get
      - name: iPhone screenshots
        script: |
          # An iPhone with the App Store's 1290 × 2796 screen, the newest runtime first.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          wanted = ["iPhone 17 Plus", "iPhone 16 Plus", "iPhone 15 Pro Max", "iPhone 15 Plus"]
          devices = json.load(sys.stdin)["devices"]
          for name in wanted:
              for runtime in sorted(devices, reverse=True):
                  for d in devices[runtime]:
                      if d["name"] == name:
                          print(d["udid"]); sys.exit()
          sys.exit("no iPhone with a 1290 x 2796 screen")')
          xcrun simctl boot "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged \
            --batteryLevel 100 --wifiBars 3 --cellularBars 4
          flutter drive --driver=test_driver/screenshots.dart \
            --target=integration_test/store_screenshots_test.dart -d "$UDID" \
            --dart-define=SHOT_STORE=appstore \
            --dart-define=SHOT_LOGIN="$SHOT_LOGIN" --dart-define=SHOT_PASSWORD="$SHOT_PASSWORD"
      - name: Android screenshots
        script: |
          emulator -avd emulator -no-window -no-audio -no-boot-anim > /dev/null 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
          adb shell settings put global sysui_demo_allowed 1
          adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
          flutter drive --driver=test_driver/screenshots.dart \
            --target=integration_test/store_screenshots_test.dart -d emulator-5554 \
            --dart-define=SHOT_STORE=play \
            --dart-define=SHOT_LOGIN="$SHOT_LOGIN" --dart-define=SHOT_PASSWORD="$SHOT_PASSWORD"
    artifacts:
      - build/screenshots/*.png
