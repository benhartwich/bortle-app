name: bortle_app
description: "Bortle: plan, control and develop your astrophotography nights"
publish_to: 'none'

version: 0.7.0+13

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Material and Cupertino moved out of the framework into packages (Flutter 3.47).
  # material_ui also brings Flutter's own texts (date picker, tooltips) in German and
  # English (GlobalMaterialLocalizations.delegates, lib/l10n.dart).
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  http: ^1.6.0
  # The server address and this device's token, in the Keychain / Keystore.
  flutter_secure_storage: ^11.2.0
  # Push through Firebase Cloud Messaging, in the project shared with allskyhub
  # (docs/CONCEPT.md, "Push"); the identifiers come in as --dart-defines at build time.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # The site for the tools without an account (lib/tools): where the phone is, coarse,
  # used on the phone only; the weather asks with the place rounded to 0.1°.
  geolocator: ^14.1.2
  # Opens Touch'N'Stars (NINA's web plugin) in the phone's browser from the rig page.
  url_launcher: ^6.3.3
  # The sky map's "Handy-Ausrichtung" (lib/sky): accelerometer and magnetometer, read
  # only while that mode is on (BSD-3-Clause).
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Store screenshots of the real app at Codemagic (integration_test/, test_driver/).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the launcher icons from assets/icon (MIT); `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.4

# The icon: assets/icon/parts.py writes the SVGs (sky over a town's glow, a spiral galaxy),
# rendered to PNG; background, foreground and monochrome for Android's adaptive and themed
# icons, the same scheme as allskyhub's.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # The objects for the tools without an account: Bortle's curated targets and the
  # Messier and bright NGC/IC objects from OpenNGC (CC BY-SA 4.0, assets/CATALOG.md).
  assets:
    - assets/catalog.json
    # The sky map's stars and constellation figures, from d3-celestial (BSD-3-Clause,
    # assets/SKY.md, LICENSES/BSD-3-Clause-d3-celestial.txt).
    - assets/sky.json

  # Display font, the same as allskyhub's (OFL-1.1, LICENSES/OFL-1.1.txt).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
