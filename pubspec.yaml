name: bortle_app
description: "Bortle: plan, control and develop your astrophotography nights"
publish_to: 'none'

version: 0.3.0+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter's own texts (date picker, tooltips) in German and English (lib/l10n.dart).
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  # The server address and this device's token, in the Keychain / Keystore.
  flutter_secure_storage: ^11.2.0
  # Push through Firebase Cloud Messaging, in the project shared with allskyhub
  # (docs/CONCEPT.md, "Push"); the identifiers come in as --dart-defines at build time.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # The site for the tools without an account (lib/tools): where the phone is, coarse,
  # used on the phone only; the weather asks with the place rounded to 0.1°.
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the launcher icons from assets/icon (MIT); `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.4

# The icon: assets/icon/parts.py writes the SVGs (sky over a town's glow, a spiral galaxy),
# rendered to PNG; background, foreground and monochrome for Android's adaptive and themed
# icons, the same scheme as allskyhub's.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # The objects for the tools without an account: Bortle's curated targets and the
  # Messier and bright NGC/IC objects from OpenNGC (CC BY-SA 4.0, assets/CATALOG.md).
  assets:
    - assets/catalog.json

  # Display font, the same as allskyhub's (OFL-1.1, LICENSES/OFL-1.1.txt).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
